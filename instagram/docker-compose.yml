services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: instagram
      POSTGRES_PASSWORD: instagram
      POSTGRES_DB: instagram
    ports:
      - "5439:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6386:6379"
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
