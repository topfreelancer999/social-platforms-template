services:
  redis:
    image: redis:7-alpine
    ports:
      - '6390:6379'
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: snapchat
      POSTGRES_PASSWORD: snapchat
      POSTGRES_DB: snapchat
    ports:
      - '5443:5432'
    volumes:
      - snapchat_pg:/var/lib/postgresql/data

volumes:
  snapchat_pg:
