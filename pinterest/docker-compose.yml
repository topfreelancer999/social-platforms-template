services:
  redis:
    image: redis:7-alpine
    ports:
      - '6391:6379'
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pinterest
      POSTGRES_PASSWORD: pinterest
      POSTGRES_DB: pinterest
    ports:
      - '5444:5432'
    volumes:
      - pinterest_pg:/var/lib/postgresql/data

volumes:
  pinterest_pg:
