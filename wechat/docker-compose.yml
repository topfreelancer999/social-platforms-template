services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wechat
      POSTGRES_PASSWORD: wechat
      POSTGRES_DB: wechat
    ports:
      - "5441:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6388:6379"
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
